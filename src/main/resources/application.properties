# ====================================
# Survey Backend Service Configuration
# ====================================

# Server Configuration
server.port=8080
server.address=0.0.0.0
spring.application.name=survey-backend

# ====================================
# Database Configuration (H2 In-Memory)
# ====================================
spring.datasource.url=jdbc:h2:mem:surveydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ====================================
# Security & JWT Configuration
# ====================================
jwt.secret=SurveyBackendSecretKeyForJWTTokenGenerationAndValidation2024VerySecureKey
jwt.expiration=86400000
# JWT expiration: 86400000ms = 24 hours

# ====================================
# CORS Configuration
# ====================================
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8080
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# ====================================
# LLM Service Configuration
# ====================================
llm.service.url=http://localhost:8000
llm.service.timeout=120000
# Timeout: 120000ms = 2 minutes

# ====================================
# Logging Configuration
# ====================================
logging.level.com.survey=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ====================================
# Actuator Configuration
# ====================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ====================================
# JSON Configuration
# ====================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ====================================
# Async Configuration
# ====================================
spring.mvc.async.request-timeout=120000

