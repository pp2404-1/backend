# ====================================
# Survey Backend Service Configuration
# ====================================

# Server Configuration
server.port=8080
server.address=0.0.0.0
spring.application.name=survey-backend

# ====================================
# Database Service Configuration
# ====================================
# Using external database service instead of embedded H2
db.service.url=http://localhost:8001/api/v1
db.service.timeout=30000
# Timeout: 30000ms = 30 seconds

# ====================================
# Database Configuration (H2 - Optional Fallback)
# ====================================
# Uncomment below to use H2 for local development without db_service
#spring.datasource.url=jdbc:h2:mem:surveydb
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.jpa.hibernate.ddl-auto=create-drop
#spring.jpa.show-sql=false
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# ====================================
# Security & JWT Configuration
# ====================================
jwt.secret=SurveyBackendSecretKeyForJWTTokenGenerationAndValidation2024VerySecureKey
jwt.expiration=86400000
# JWT expiration: 86400000ms = 24 hours

# ====================================
# CORS Configuration
# ====================================
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8080
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# ====================================
# LLM Service Configuration
# ====================================
llm.service.url=http://localhost:8000
llm.service.timeout=300000
# Timeout: 300000ms = 5 minutes

# ====================================
# Logging Configuration
# ====================================
logging.level.com.survey=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ====================================
# Actuator Configuration
# ====================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ====================================
# JSON Configuration
# ====================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ====================================
# Async Configuration
# ====================================
spring.mvc.async.request-timeout=300000

